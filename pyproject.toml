
[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ai-platform"
version = "0.1.0"
description = "An enterprise AI platform for business analytics, machine learning, knowledge retrieval, and controlled AI workflows."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.143.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
